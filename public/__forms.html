<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form definitions</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify Forms detects this static form at deploy time. The visible form on /en/contact/ and /fr/contact/ posts the same fields. -->
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field">
  <input name="language">
  <input name="name">
  <input name="organization">
  <input name="email" type="email">
  <input name="topic">
  <textarea name="message"></textarea>
  <input name="consent" type="checkbox" value="yes">
</form>
</body>
</html>
